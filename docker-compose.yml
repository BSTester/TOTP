services:
  totp:
    build:
      context: .
      dockerfile: Dockerfile
    image: totp-hosted:latest
    container_name: totp-hosted
    ports:
      - "8010:8010"
    environment:
      APP_DB_PATH: /data/data.db
      APP_MASTER_KEY_FILE: /data/.master_key
    volumes:
      - totp_data:/data
    restart: unless-stopped

volumes:
  totp_data:
